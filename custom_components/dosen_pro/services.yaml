screen_show:
  fields:
    camera_entity:
      selector:
        entity: {domain: camera}
    media:
      selector: {media: {}}
    source:
      example: "http://192.168.1.10:8123/local/clip.mp4"
      selector: {text: {}}
    loop:
      default: false
      selector: {boolean: {}}
    live:
      selector: {boolean: {}}
    after:
      default: "off"
      selector:
        select:
          options: ["off", "hold"]
    owner:
      default: "automation"
      selector: {text: {}}
    ttl:
      selector: {number: {min: 1, max: 86400, unit_of_measurement: "s", mode: box}}
    entry_id:
      selector: {text: {}}
screen_text:
  fields:
    title:
      example: "Trợ lý"
      selector: {text: {}}
    messages:
      example: '[{"role": "user", "text": "Bật đèn"}, {"role": "assistant", "text": "Đã bật."}]'
      selector: {object: {}}
    font_size:
      default: 15
      selector: {number: {min: 10, max: 30, mode: box}}
    after:
      default: "hold"
      selector:
        select:
          options: ["off", "hold"]
    owner:
      default: "automation"
      selector: {text: {}}
    ttl:
      selector: {number: {min: 1, max: 86400, unit_of_measurement: "s", mode: box}}
    entry_id:
      selector: {text: {}}
screen_card:
  fields:
    title:
      example: "Điện năng lượng mặt trời"
      selector: {text: {}}
    main_entity:
      selector:
        entity: {}
    value:
      example: "3,4 kW"
      selector: {text: {}}
    caption:
      example: "Đang phát"
      selector: {text: {}}
    color:
      default: "red"
      selector:
        select:
          options: ["red", "black", "blue", "green", "orange"]
    entities:
      selector:
        entity: {multiple: true}
    rows:
      example: '[{"label": "Hôm nay", "value": "18,6 kWh"}, {"label": "Pin", "value": "87 %", "color": "green"}]'
      selector: {object: {}}
    after:
      default: "hold"
      selector:
        select:
          options: ["off", "hold"]
    owner:
      default: "automation"
      selector: {text: {}}
    ttl:
      selector: {number: {min: 1, max: 86400, unit_of_measurement: "s", mode: box}}
    entry_id:
      selector: {text: {}}
screen_carousel:
  fields:
    pages:
      example: '[{"type": "clock", "seconds": 15}, {"type": "card", "title": "Điện", "main_entity": "sensor.cong_suat", "seconds": 10}, {"type": "camera", "camera_entity": "camera.cua", "seconds": 8}]'
      selector: {object: {}}
    seconds:
      default: 20
      selector: {number: {min: 3, max: 3600, unit_of_measurement: "s", mode: box}}
    enabled:
      default: true
      selector: {boolean: {}}
    entry_id:
      selector: {text: {}}
screen_release:
  fields:
    owner:
      required: true
      selector: {text: {}}
    entry_id:
      selector: {text: {}}
screen_default:
  fields:
    mode:
      required: true
      selector:
        select:
          options: ["off", "clock", "image", "video", "live"]
    camera_entity:
      selector:
        entity: {domain: camera}
    media:
      selector: {media: {}}
    source:
      selector: {text: {}}
    rotate:
      selector:
        select:
          options: ["0", "90", "180", "270"]
    fit:
      selector:
        select:
          options: ["contain", "cover"]
    entry_id:
      selector: {text: {}}
screen_off:
  fields:
    entry_id:
      selector: {text: {}}
screen_power:
  fields:
    'on':
      required: true
      default: true
      selector: {boolean: {}}
    entry_id:
      selector: {text: {}}
screen_sleep:
  fields:
    seconds:
      required: true
      default: 0
      selector: {number: {min: 0, max: 3600, unit_of_measurement: "s", mode: box}}
    entry_id:
      selector: {text: {}}
