blueprint:
  name: "Dosen Pro: nhiều sự kiện lên màn camera (ưu tiên, chia đôi, xoay camera)"
  description: >-
    **Một automation, tới 4 «ô» sự kiện.** Mỗi ô có điều kiện kích hoạt riêng và chiếu MỘT loại riêng lên màn camera
    (camera trực tiếp, hình, video hay dòng chữ), kèm **mức ưu tiên** và thời gian giữ riêng. Ô nào không chọn cảm biến thì tắt.


    **Luật chiếu** (do tích hợp xử lý, áp cho mọi sự kiện kể cả cuộc gọi Zalo):

    - Mức ưu tiên cao hơn **luôn ở trên**; hai sự kiện kích cùng lúc thì mức cao hiện trước, mức thấp chờ bên dưới (thời gian giữ vẫn chạy).

    - Cùng mức thì **sự kiện tới sau đè lên** (kể cả đang xem hình cuộc gọi Zalo), hết thì khôi phục cái bên dưới.

    - **Camera** cùng mức trên cùng thì **chia đôi màn** (trên / dưới, tối đa 2 camera một lúc). Có hơn 2 camera thì cứ **5 giây đổi một lượt**,
      dù thời gian giữ của mỗi camera dài hơn; camera nào hết thời gian giữ thì rơi khỏi vòng.

    - Hết sự kiện cuối thì về màn hình mặc định (đồng hồ, luân phiên…).


    Điều kiện kích hoạt của mỗi ô là «**thực thể đổi sang trạng thái**» (cảm biến người, cửa mở, chuông…). Muốn điều kiện phức tạp hơn
    (khung giờ, nhiều điều kiện) thì dùng blueprint «chiếu lên màn camera khi có sự kiện» hoặc tự viết automation gọi `dosen_pro.screen_show`.
  domain: automation
  author: TriTue2011
  homeassistant:
    min_version: 2024.11.0
  input:
    o1:
      name: "Ô 1"
      icon: mdi:numeric-1-box-outline
      collapsed: false
      input:
        e1:
          name: "Khi thực thể nào đổi trạng thái"
          description: "Để trống = tắt ô này. Chọn nhiều thực thể thì cái nào đổi cũng kích hoạt."
          default: []
          selector:
            entity: {multiple: true}
        t1:
          name: "Sang trạng thái"
          default: "on"
          selector:
            text: {}
        k1:
          name: "Chiếu gì"
          default: camera
          selector:
            select:
              options:
                - {value: camera, label: "Camera trực tiếp"}
                - {value: anh, label: "Hình ảnh"}
                - {value: video, label: "Video"}
                - {value: chu, label: "Dòng chữ"}
        c1:
          name: "Camera (khi chọn «Camera trực tiếp»)"
          description: "Chọn một hay nhiều camera; nhiều camera thì chia đôi màn / xoay vòng 5 giây."
          default: []
          selector:
            entity: {domain: camera, multiple: true}
        m1:
          name: "Hình / video lấy từ kho media (khi chọn «Hình ảnh» hoặc «Video»)"
          default: {}
          selector:
            media: {}
        n1:
          name: "Hoặc địa chỉ gõ tay"
          description: "Nếu điền thì dùng thay cho ô chọn media: URL http(s):// hoặc rtsp://."
          default: ""
          selector:
            text: {}
        lp1:
          name: "Lặp video"
          default: false
          selector:
            boolean: {}
        td1:
          name: "Tiêu đề (khi chọn «Dòng chữ»)"
          default: "Thông báo"
          selector:
            text: {}
        nd1:
          name: "Nội dung (khi chọn «Dòng chữ»)"
          default: ""
          selector:
            text: {multiline: true}
        u1:
          name: "Mức ưu tiên (độ rủi ro)"
          description: "Cao hơn thì luôn ở trên. Ví dụ: có người lạ = Cao, khói/cháy = Khẩn cấp, chuông cửa = Thường."
          default: "2"
          selector:
            select:
              options:
                - {value: "1", label: "1 · Thấp"}
                - {value: "2", label: "2 · Thường"}
                - {value: "3", label: "3 · Cao"}
                - {value: "4", label: "4 · Khẩn cấp"}
        tg1:
          name: "Giữ trên màn bao lâu (giây)"
          description: "0 = camera/hình giữ tới khi có sự kiện cao hơn hoặc hết; video không lặp thì tới khi hết video."
          default: 10
          selector:
            number: {min: 0, max: 3600, unit_of_measurement: "s", mode: box}
        l1:
          name: "Tên lớp"
          description: "Cùng tên thì thay nhau. Đừng dùng «zalo_call» và «zalo_call_video»."
          default: "su_kien_1"
          selector:
            text: {}
