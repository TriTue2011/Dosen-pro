mode: parallel
max_exceeded: silent
trigger:
  - trigger: state
    entity_id: !input e1
    to: !input t1
    id: "0"
  - trigger: state
    entity_id: !input e2
    to: !input t2
    id: "1"
  - trigger: state
    entity_id: !input e3
    to: !input t3
    id: "2"
  - trigger: state
    entity_id: !input e4
    to: !input t4
    id: "3"
variables:
  slots:
    - k: !input k1
      c: !input c1
      m: !input m1
      n: !input n1
      lp: !input lp1
      td: !input td1
      nd: !input nd1
      u: !input u1
      tg: !input tg1
      l: !input l1
    - k: !input k2
      c: !input c2
      m: !input m2
      n: !input n2
      lp: !input lp2
      td: !input td2
      nd: !input nd2
      u: !input u2
      tg: !input tg2
      l: !input l2
    - k: !input k3
      c: !input c3
      m: !input m3
      n: !input n3
      lp: !input lp3
      td: !input td3
      nd: !input nd3
      u: !input u3
      tg: !input tg3
      l: !input l3
    - k: !input k4
      c: !input c4
      m: !input m4
      n: !input n4
      lp: !input lp4
      td: !input td4
      nd: !input nd4
      u: !input u4
      tg: !input tg4
      l: !input l4
action:
  - variables:
      s: "{{ slots[trigger.id | int] }}"
  - choose:
      - conditions: "{{ s.k == 'chu' }}"
        sequence:
          - action: dosen_pro.screen_text
            data: >-
              {% set d = {'title': s.td, 'messages': [{'role': 'info', 'text': s.nd}], 'owner': s.l, 'after': 'hold',
                          'priority': s.u | int(2)} %}
              {% if s.tg | float(0) > 0 %}{% set d = dict(d, ttl=s.tg | float) %}{% endif %}
              {{ d }}
      - conditions: "{{ s.k == 'camera' }}"
        sequence:
          - repeat:
              for_each: "{{ s.c if s.c is list else [s.c] }}"
              sequence:
                - action: dosen_pro.screen_show
                  data: >-
                    {% set d = {'camera_entity': repeat.item, 'owner': s.l ~ '_' ~ repeat.index, 'after': 'hold',
                                'priority': s.u | int(2), 'split': true} %}
                    {% if s.tg | float(0) > 0 %}{% set d = dict(d, ttl=s.tg | float) %}{% endif %}
                    {{ d }}
    default:
      - action: dosen_pro.screen_show
        data: >-
          {% set d = {'loop': s.lp, 'owner': s.l, 'priority': s.u | int(2),
                      'after': 'hold' if (s.k == 'anh' or s.tg | float(0) > 0) else 'off'} %}
          {% set d = dict(d, source=s.n) if s.n != '' else dict(d, media=s.m) %}
          {% if s.tg | float(0) > 0 %}{% set d = dict(d, ttl=s.tg | float) %}{% endif %}
          {{ d }}
