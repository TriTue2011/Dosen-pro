blueprint:
  name: "Dosen Pro: chiếu lên màn camera khi có sự kiện"
  description: >-
    Khi có sự kiện (chuông cửa, phát hiện người, cảm biến mở cửa…) thì chiếu lên màn hình camera
    một video, hình, camera khác trực tiếp (rtsp://…) hoặc một dòng chữ. **Sự kiện gần nhất đè lên**
    cái đang hiện; hết thời gian (hoặc hết video) thì màn hình **về lớp bên dưới / màn hình mặc định**
    (đồng hồ, ảnh, video, camera trực tiếp… cài ở thiết bị Dosen Pro).
    Mỗi automation dùng một «tên lớp»: cùng tên thì thay nhau, khác tên thì xếp chồng.
  domain: automation
  author: TriTue2011
  homeassistant:
    min_version: 2024.11.0
  input:
    trigger:
      name: Khi nào
      description: Sự kiện làm hiện màn hình (thêm một hay nhiều điều kiện kích hoạt).
      selector:
        trigger: {}
    dieu_kien:
      name: Điều kiện thêm (tuỳ chọn)
      default: []
      selector:
        condition: {}
    kieu:
      name: Chiếu gì
      default: video
      selector:
        select:
          options:
            - {value: video, label: "Video (tệp/URL)"}
            - {value: camera, label: "Camera trực tiếp (rtsp://…)"}
            - {value: anh, label: "Hình ảnh"}
            - {value: chu, label: "Dòng chữ"}
    camera:
      name: Camera (khi chọn «Camera trực tiếp»)
      description: "Chọn camera trong danh sách của HA; luồng xem lấy tự động."
      default: ""
      selector:
        entity:
          domain: camera
    media:
      name: Video / hình (khi chọn «Video» hoặc «Hình ảnh»)
      description: "Chọn tệp trong kho media của HA (hoặc tải lên)."
      default: {}
      selector:
        media: {}
    nguon:
      name: Địa chỉ gõ tay (không bắt buộc)
      description: "Nếu điền thì dùng thay cho ô chọn ở trên: URL http(s):// hoặc rtsp://."
      default: ""
      selector:
        text: {}
    lap:
      name: Lặp video
      default: false
      selector:
        boolean: {}
    tieu_de:
      name: Tiêu đề (cho dòng chữ)
      default: "Thông báo"
      selector:
        text: {}
    noi_dung:
      name: Nội dung (cho dòng chữ)
      default: ""
      selector:
        text: {multiline: true}
    thoi_gian:
      name: Giữ trên màn bao lâu (giây)
      description: "0 = tới khi hết video (video không lặp) hoặc tới khi có sự kiện khác đè lên."
      default: 30
      selector:
        number: {min: 0, max: 3600, unit_of_measurement: "s", mode: box}
    ten_lop:
      name: Tên lớp
      description: "Cùng tên thì thay nhau; ví dụ «chuong_cua», «nguoi_la». Đừng dùng «assist» và «zalo_call» (dành cho Assist và cuộc gọi Zalo)."
      default: "su_kien"
      selector:
        text: {}
mode: restart
max_exceeded: silent
trigger: !input trigger
condition: !input dieu_kien
variables:
  kieu: !input kieu
  media: !input media
  nguon: !input nguon
  camera: !input camera
  lap: !input lap
  tieu_de: !input tieu_de
  noi_dung: !input noi_dung
  thoi_gian: !input thoi_gian
  ten_lop: !input ten_lop
action:
  - choose:
      - conditions: "{{ kieu == 'chu' }}"
        sequence:
          - action: dosen_pro.screen_text
            data: >-
              {% set d = {'title': tieu_de, 'messages': [{'role': 'info', 'text': noi_dung}], 'owner': ten_lop, 'after': 'hold'} %}
              {% if thoi_gian | float(0) > 0 %}{% set d = dict(d, ttl=thoi_gian | float) %}{% endif %}
              {{ d }}
      - conditions: "{{ kieu == 'camera' }}"
        sequence:
          - action: dosen_pro.screen_show
            data: >-
              {% set d = {'camera_entity': camera, 'owner': ten_lop, 'after': 'hold'} %}
              {% if thoi_gian | float(0) > 0 %}{% set d = dict(d, ttl=thoi_gian | float) %}{% endif %}
              {{ d }}
    default:
      - action: dosen_pro.screen_show
        data: >-
          {% set d = {'loop': lap, 'owner': ten_lop,
                      'after': 'hold' if (kieu == 'anh' or thoi_gian | float(0) > 0) else 'off'} %}
          {% set d = dict(d, source=nguon) if nguon != '' else dict(d, media=media) %}
          {% if thoi_gian | float(0) > 0 %}{% set d = dict(d, ttl=thoi_gian | float) %}{% endif %}
          {{ d }}
