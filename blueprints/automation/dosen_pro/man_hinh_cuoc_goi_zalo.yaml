blueprint:
  name: "Dosen Pro: cuộc gọi Zalo lên màn camera"
  description: >-
    Cuộc gọi Zalo đến, đang đổ chuông, đang nói chuyện thì hiện lên màn hình camera (tên người gọi,
    và **hình video của cuộc gọi** nếu điền địa chỉ hình). Kết thúc, nhỡ, từ chối hay lỗi thì tự gỡ,
    màn hình **về sự kiện bên dưới hoặc màn hình mặc định**. Cuộc gọi gần nhất đè lên các sự kiện khác.
    Dùng sự kiện `zalo_call_call_state` của tích hợp Zalo Call.
  domain: automation
  author: TriTue2011
  homeassistant:
    min_version: 2024.11.0
  input:
    video_url:
      name: Địa chỉ hình video cuộc gọi (tuỳ chọn)
      description: >-
        Luồng hình của cuộc gọi (MJPEG của app Zalo, ví dụ http://<máy app Zalo>:8090/api/call/video/view),
        hoặc để trống để chỉ hiện chữ. Chỉ chiếu hình khi đang nói chuyện (đã nghe máy).
      default: ""
      selector:
        text: {}
    hien_khi:
      name: Hiện khi cuộc gọi ở trạng thái
      default: [incoming, ringing, answered]
      selector:
        select:
          multiple: true
          options:
            - {value: incoming, label: "Có cuộc gọi đến"}
            - {value: ringing, label: "Đang gọi đi (đổ chuông)"}
            - {value: answered, label: "Đang nói chuyện"}
mode: queued
max: 5
trigger:
  - platform: event
    event_type: zalo_call_call_state
variables:
  hien_khi: !input hien_khi
  video_url: !input video_url
  state: "{{ trigger.event.data.state | default('') }}"
  peer: "{{ trigger.event.data.peer | default('?') }}"
  ket_thuc: [ended, missed, rejected, declined, no_answer, error]
action:
  - choose:
      - conditions: "{{ state in ket_thuc }}"
        sequence:
          - action: dosen_pro.screen_release
            data: {owner: zalo_call}
      - conditions: "{{ state == 'answered' and state in hien_khi and video_url != '' }}"
        sequence:
          - action: dosen_pro.screen_show
            data:
              source: "{{ video_url }}"
              owner: zalo_call
              after: hold
      - conditions: "{{ state in hien_khi }}"
        sequence:
          - action: dosen_pro.screen_text
            data: >-
              {% set kieu = {'incoming': 'đang gọi đến', 'ringing': 'đang đổ chuông', 'answered': 'đang nói chuyện'}[state] | default('') %}
              {{ {'title': 'Zalo', 'owner': 'zalo_call', 'after': 'hold', 'ttl': 120,
                   'messages': [{'role': 'caller', 'text': peer ~ ' ' ~ kieu}]} }}
