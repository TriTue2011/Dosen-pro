# Dựng và đẩy ảnh Docker lên GHCR: ghcr.io/tritue2011/dosen-pro:<phiên bản> và :latest.
# Chạy khi đẩy thẻ v* (ví dụ v2026.11.15.0) hoặc bấm chạy tay. Bước dựng chạy bộ test
# của server/ (Dockerfile có «RUN pytest»), ảnh hỏng test thì không được đẩy.
name: Image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Thẻ ảnh (ví dụ 2026.11.15.0)'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Xác định thẻ
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then v="${{ github.event.inputs.version }}"; else v="${GITHUB_REF_NAME#v}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/tritue2011/dosen-pro:${{ steps.v.outputs.version }}
            ghcr.io/tritue2011/dosen-pro:latest
