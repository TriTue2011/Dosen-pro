# Kiểm thử: lõi DVRIP (camera giả, ffmpeg thật) và tích hợp Home Assistant.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Cài ffmpeg (có libx265)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install pytest Pillow
      - name: Test lõi (camera giả)
        run: python -m pytest tests/core -q -p no:asyncio

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pytest-homeassistant-custom-component
      - name: Test tích hợp Home Assistant
        run: python -m pytest tests/ha -q
